name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    # Normal duration is well under a minute; without a timeout a hung step
    # can hold a required check for GitHub's 6-hour default (#68).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    # The suite itself runs in ~30s; the browser install dominates and has
    # hung silently for over an hour before (#68).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Split from the browser download so a hang is attributable to one
      # half or the other; apt is quick since ubuntu-latest already carries
      # most of Playwright's system dependencies. Quick when it works, that
      # is: the underlying apt fetch has intermittently hung until the
      # 20-minute job timeout (#85), so the step is bounded to minutes and
      # retried once instead of letting the job timeout absorb the hang.
      # continue-on-error keeps a first-attempt hang (which surfaces as a
      # failed/cancelled step outcome) from failing the job before the
      # retry runs; the retry's outcome is the one that counts.
      - name: Install Playwright system dependencies
        id: install-system-deps
        timeout-minutes: 4
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Install Playwright system dependencies (retry)
        if: steps.install-system-deps.outcome != 'success'
        timeout-minutes: 4
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
