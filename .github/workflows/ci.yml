name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A session whose container has no Firefox measures in CI's Firefox by
  # dispatching this workflow on its own branch, before writing the fix
  # (#779, docs/rules/quality-and-ci.md). A dispatched run never deploys:
  # deploy.yml acts only on a CI run whose event is a push to main.
  workflow_dispatch:

jobs:
  checks:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    # Normal duration is well under a minute; without a timeout a hung step
    # can hold a required check for GitHub's 6-hour default (#68).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Plugin code must stay out of the entry bundle (#197, ADR 0003): the
      # check reads the build's manifest, so it must follow the Build step.
      - name: Plugin bundle discipline
        run: npm run check:bundle

  e2e:
    # One job per browser, run side by side (#1047). Until then both suites
    # ran one after the other in one job, `Browser tests (Playwright)`, and
    # on #1044's run that was Chromium 19 m and then Firefox 27 m: every PR's
    # merge waited out the sum. The `main` ruleset requires no status check
    # by name (#1047 read it), and deploy.yml follows the CI workflow's
    # conclusion, not job names, so the split needs no change elsewhere. The
    # flake-watch rule names these jobs (docs/rules/quality-and-ci.md).
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one browser does not cancel the other, so one run
      # still reports both, as the Firefox step's `!cancelled()` did when
      # they shared a job.
      fail-fast: false
      matrix:
        include:
          - project: chromium
            name: Chromium
          - project: firefox
            name: Firefox
    # The browser install has hung silently for over an hour before (#68),
    # hence a bound at all. The bound must cover the worst case the step
    # caps below allow, or a slow mirror that the retry does get through
    # still cancels the job (#714, run 44343576004): the apt steps' caps on
    # the cache-miss path are 2 + 4 + 8 + 6 + 2 + 2 = 24 minutes, the slower
    # suite, Firefox, took 26.8 minutes on #1044's run (job 140507830639),
    # and setup about one more: 52 minutes. Each leg now carries one suite
    # rather than both, which is what brings the worst case back under 55.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # Both legs use this one key and install both browsers on a miss, so the
      # key is the one main already holds and the split costs no miss (#1047).
      # On a miss both legs try to save it; the second is told the key exists,
      # which actions/cache reports as a warning, not a failure.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The browser set is part of the key: a cache saved when only
          # Chromium was installed would otherwise hit and skip Firefox's
          # install (#586).
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox

      # The system packages this job needs and the runner image lacks —
      # Playwright's dependencies and PulseAudio, ~64 packages and 61 MB on
      # ubuntu-26.04 — come from a cache of their .deb files, so a normal run
      # never touches the apt mirror (#714). The mirror has hung for minutes
      # at a time (#85): the retry below gets through it, but at a cost of up
      # to 12 minutes and, three times in a week, a failed or cancelled job.
      # The key holds the runner image's version, since what an image lacks
      # and which versions fit it change with the image, and Playwright's
      # version, since its dependency list changes with it. A new key misses
      # once: that run installs from the mirror as before and fills the
      # cache. `.github/scripts/apt-debs.sh` has the details.
      - name: Resolve runner image
        id: runner-image
        # Both are set on GitHub-hosted runners; the fallback rotates weekly.
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-$(date +%G-W%V)}" >> "$GITHUB_OUTPUT"

      - name: Restore cached system packages
        id: apt-cache
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.runner-image.outputs.id }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-firefox-pulseaudio

      # dpkg alone, no mirror. If it fails (a cache that no longer fits),
      # the script purges what it added and the network steps below run as
      # they did before the cache existed.
      - name: Install system packages from the cache
        id: deps-from-cache
        if: steps.apt-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: .github/scripts/apt-debs.sh install ~/apt-debs

      # Everything from here to the cache's save step is the network path,
      # taken only when the cache did not install the packages.
      - name: Record installed packages
        if: steps.deps-from-cache.outcome != 'success'
        run: .github/scripts/apt-debs.sh snapshot "$RUNNER_TEMP/packages-before"

      # The runner image ships an apt source for Google Chrome, and
      # `install-deps` runs `apt-get update`, so every Playwright job depends
      # on a third-party index it has no use for: Chromium's system libraries
      # come from Ubuntu's own archives, and that list is there for the
      # preinstalled browser. On 2026-09-09 dl.google.com served a
      # `Packages.gz` that did not match the SHA256 in its own `InRelease`,
      # apt failed the whole update, and `install-deps` exited 100 twenty-five
      # seconds into the job — on every PR at once (#447).
      #
      # This is NOT the fault the two retry steps below handle. Those exist
      # for an apt that hangs or dies holding the lock (#85, #89), so they
      # kill the leader, repair dpkg state and fetch again. Fetching again is
      # exactly what cannot fix a corrupt index: the re-run of #447's failed
      # job returned the same two hashes. Removing the source is the only
      # move that helps, and it is safe — it uninstalls nothing, and matches
      # nothing (a silent no-op) on an image that stops shipping the list.
      - name: Drop the Google Chrome apt source
        if: steps.deps-from-cache.outcome != 'success'
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -f
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      # Split from the browser download so a hang is attributable to one
      # half or the other; apt is quick since ubuntu-latest already carries
      # most of Playwright's system dependencies. Quick when it works, that
      # is: the underlying apt fetch has intermittently hung until the
      # 20-minute job timeout (#85), so the step is bounded to minutes and
      # retried once instead of letting the job timeout absorb the hang.
      # continue-on-error keeps a first-attempt hang (which surfaces as a
      # failed/cancelled step outcome) from failing the job before the
      # retry runs; the retry's outcome is the one that counts.
      - name: Install Playwright system dependencies
        id: install-system-deps
        if: steps.deps-from-cache.outcome != 'success'
        timeout-minutes: 4
        continue-on-error: true
        run: npx playwright install-deps chromium firefox

      # A step timeout kills only the step's leader process, so a timed-out
      # first attempt can leave its apt-get (#89) and the dpkg under it
      # (#643) running and holding their locks: the retry first failed in
      # seconds on the one, and then on the other. settle-dpkg.sh stops
      # apt-get, waits up to 2 minutes for a running dpkg (it may be doing
      # real work), and repairs dpkg state; its header has the details.
      # 8 minutes: the 6 this step had before #643 (the observed hang burns
      # ~2¼ minutes waiting out a dead mirror before apt falls back and makes
      # progress), plus that 2-minute bound.
      - name: Install Playwright system dependencies (retry)
        id: install-system-deps-retry
        # Both conditions: on the cache path the first attempt is skipped,
        # and a skipped step's outcome is not 'success' either.
        if: steps.deps-from-cache.outcome != 'success' && steps.install-system-deps.outcome != 'success'
        timeout-minutes: 8
        run: |
          .github/scripts/settle-dpkg.sh 120
          npx playwright install-deps chromium firefox

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox

      # Firefox needs an audio output it can open (#600). Without one,
      # `AudioContext.resume()` never settles: an export waits out #596's
      # bound and runs without sound, and every audio-asserting spec fails.
      # Chromium's headless build fakes its own output and does not need this.
      # A PulseAudio null sink is an output that discards what it is given.
      # Bounded like the other apt steps (#85), and `e2e/audio-output.spec.ts`
      # fails first, with a message naming this step, if it does not take.
      # It runs even when the system-deps steps failed, so an apt-get or dpkg
      # they left behind may still hold the locks, or have died part-way and
      # left dpkg needing repair (#643). settle-dpkg.sh clears both; when
      # nothing was left behind it finds nothing and returns at once. The
      # lock timeout covers any other holder, such as a background apt run.
      # 6 minutes: the 4 this step had before #643, plus the 2-minute wait.
      # PulseAudio is among the cached packages (#714), so on the cache path
      # it is already installed and apt is not run at all.
      # Only the Firefox leg runs it (#1047). The Chromium leg's outcome for
      # it is then `skipped`, so the collect step below never runs there, and
      # only the Firefox leg can save the apt cache: the set it saves still
      # holds PulseAudio, and the two legs never race to save one key.
      - name: Audio output for Firefox (PulseAudio null sink)
        id: audio-output
        if: ${{ !cancelled() && matrix.project == 'firefox' }}
        timeout-minutes: 6
        run: |
          .github/scripts/settle-dpkg.sh 120
          command -v pulseaudio >/dev/null \
            || sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e_null
          pactl set-default-sink e2e_null
          pactl info | grep -E '^(Server Name|Default Sink):'

      # Fills the cache on a miss (#714): every package the network steps
      # installed, downloaded as .deb files at the versions installed. Only
      # once both installs succeeded, so a partial set is never saved; it
      # costs a few seconds, on the one run per key that misses. "Both"
      # means install-deps (either attempt) and PulseAudio: the PulseAudio
      # step runs under !cancelled() even after the retry has failed, and
      # did succeed after one (run 44418008935), so its outcome alone would
      # let a set without Playwright's libraries be saved — and every later
      # hit would then skip install-deps on it. A hit that failed to install
      # is not re-saved (a key cannot be overwritten), so such a key keeps
      # taking the network path until the image moves on.
      - name: Collect system packages for the cache
        id: apt-collect
        if: ${{ !cancelled() && steps.apt-cache.outputs.cache-hit != 'true' && (steps.install-system-deps.outcome == 'success' || steps.install-system-deps-retry.outcome == 'success') && steps.audio-output.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        run: .github/scripts/apt-debs.sh collect "$RUNNER_TEMP/packages-before" ~/apt-debs

      - name: Save system packages to the cache
        if: ${{ !cancelled() && steps.apt-collect.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # The leg's one suite. It used to be two steps, Chromium's here before
      # the PulseAudio step and Firefox's here, in one job (#586); with a job
      # per browser the job's log is already one browser's (#1047).
      - name: Browser tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One name per leg: two legs uploading one name would collide.
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7
